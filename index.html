<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <title>Bongo Cat con Teclado</title>
  <style>
    body { background: #111; color: #fff; font-family: sans-serif; text-align:center; }
    .cat { margin:20px auto; width:200px; height:150px; background:#fff; border-radius:20px; }
    .keyboard { display:grid; grid-template-columns: repeat(10, 40px); gap:5px; justify-content:center; margin-top:20px; }
    .key { width:40px; height:40px; background:#333; border-radius:5px; display:flex; align-items:center; justify-content:center; color:#fff; }
    .key.active { background:#ff4081; }
  </style>
</head>
<body>
  <h1>Bongo Cat con Teclado</h1>
  <div class="cat">🐱</div>
  <div class="keyboard" id="keyboard">
    <div class="key" data-key="1">1</div>
    <div class="key" data-key="2">2</div>
    <div class="key" data-key="3">3</div>
    <div class="key" data-key="4">4</div>
    <div class="key" data-key="5">5</div>
    <div class="key" data-key="6">6</div>
    <div class="key" data-key="7">7</div>
    <div class="key" data-key="8">8</div>
    <div class="key" data-key="9">9</div>
    <div class="key" data-key="0">0</div>
  </div>

  <script>
    const keys = document.querySelectorAll('.key');
    window.addEventListener('keydown', e => {
      const k = document.querySelector(`.key[data-key="${e.key}"]`);
      if(k){ k.classList.add('active'); }
    });
    window.addEventListener('keyup', e => {
      const k = document.querySelector(`.key[data-key="${e.key}"]`);
      if(k){ k.classList.remove('active'); }
    });
  </script>
</body>
</html>
